# Static quality gates: lintr, spelling and URL checks.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: quality

permissions: read-all

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr, any::spelling, any::urlchecker, any::styler, local::.
          needs: lint

      - name: Style
        # styler is the formatter of record and lintr's indentation_linter is
        # switched off in .lintr, because the two disagree about continuation
        # indentation and only one of them can be right. R/ and tests/ only:
        # vignettes/*.Rmd are knitted from *.Rmd.orig, so styling the output
        # would be undone by the next rebuild.
        run: |
          res <- rbind(
            styler::style_dir("R", filetype = "R", dry = "on"),
            styler::style_dir("tests", filetype = "R", recursive = TRUE, dry = "on")
          )
          # `changed` is NA for a file styler could not assess, which is not
          # the same as a file it would rewrite; which() drops those.
          dirty <- res$file[which(res$changed)]
          if (length(dirty) > 0) {
            message("styler would change:")
            for (f in dirty) message("  ", f)
            stop("run styler::style_dir() on R/ and tests/, then commit")
          }
          message("styler clean: ", nrow(res), " files")
        shell: Rscript {0}

      - name: Lint
        run: lintr::lint_package()
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true

      - name: Spelling
        run: |
          res <- spelling::spell_check_package()
          if (nrow(res) > 0) {
            print(res)
            stop("Spelling errors found; add genuine words to inst/WORDLIST")
          }
        shell: Rscript {0}

      - name: URL check
        # Not urlchecker::url_check(), which aborts as soon as it has anything
        # to report, so its result cannot be inspected. This is the same check
        # underneath, and it hands back a table.
        #
        # An HTTP status fails the gate. A URL that could not be reached at all
        # does not: GitHub's runners consistently time out on data.police.uk
        # after five seconds, three attempts running, while it answers fine
        # elsewhere and is the package's primary data source. A timeout is not
        # evidence that a link is wrong. Both kinds are printed.
        run: |
          db <- tools:::url_db_from_package_sources(".")
          res <- as.data.frame(tools:::check_url_db(db))
          if (nrow(res) == 0) {
            message("all URLs fine")
          } else {
            print(res[, intersect(names(res), c("URL", "From", "Status", "Message"))])
            status <- suppressWarnings(as.integer(res$Status))
            unreachable <- res[is.na(status), , drop = FALSE]
            broken <- res[!is.na(status), , drop = FALSE]
            for (u in unique(unreachable$URL)) {
              message("unreachable from this runner, not treated as invalid: ", u)
            }
            if (nrow(broken) > 0) {
              stop("URL problems found: ", paste(unique(broken$URL), collapse = ", "))
            }
          }
        shell: Rscript {0}
