# Static quality gates: lintr, spelling and URL checks.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: quality

permissions: read-all

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr, any::spelling, any::urlchecker, local::.
          needs: lint

      - name: Lint
        run: lintr::lint_package()
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true

      - name: Spelling
        run: |
          res <- spelling::spell_check_package()
          if (nrow(res) > 0) {
            print(res)
            stop("Spelling errors found; add genuine words to inst/WORDLIST")
          }
        shell: Rscript {0}

      - name: URL check
        # Not urlchecker::url_check(), which aborts as soon as it has anything
        # to report, so its result cannot be inspected. This is the same check
        # underneath, and it hands back a table.
        #
        # An HTTP status fails the gate. A URL that could not be reached at all
        # does not: GitHub's runners consistently time out on data.police.uk
        # after five seconds, three attempts running, while it answers fine
        # elsewhere and is the package's primary data source. A timeout is not
        # evidence that a link is wrong. Both kinds are printed.
        run: |
          db <- tools:::url_db_from_package_sources(".")
          res <- as.data.frame(tools:::check_url_db(db))
          if (nrow(res) == 0) {
            message("all URLs fine")
          } else {
            print(res[, intersect(names(res), c("URL", "From", "Status", "Message"))])
            status <- suppressWarnings(as.integer(res$Status))
            unreachable <- res[is.na(status), , drop = FALSE]
            broken <- res[!is.na(status), , drop = FALSE]
            for (u in unique(unreachable$URL)) {
              message("unreachable from this runner, not treated as invalid: ", u)
            }
            if (nrow(broken) > 0) {
              stop("URL problems found: ", paste(unique(broken$URL), collapse = ", "))
            }
          }
        shell: Rscript {0}
