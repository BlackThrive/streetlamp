# Static quality gates: lintr, spelling and URL checks.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: quality

permissions: read-all

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr, any::spelling, any::urlchecker, local::.
          needs: lint

      - name: Lint
        run: lintr::lint_package()
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true

      - name: Spelling
        run: |
          res <- spelling::spell_check_package()
          if (nrow(res) > 0) {
            print(res)
            stop("Spelling errors found; add genuine words to inst/WORDLIST")
          }
        shell: Rscript {0}

      - name: URL check
        # Fails on an HTTP status, not on a timeout. GitHub's runners cannot
        # reach data.police.uk inside urlchecker's five second budget, three
        # attempts running, while it answers fine elsewhere and it is the
        # package's own primary data source. A URL that times out has not been
        # shown to be wrong; a 404 has. Timeouts are printed either way.
        # urlchecker::url_check() aborts when its result is printed, so the
        # result goes through as.data.frame().
        run: |
          res <- NULL
          for (attempt in 1:3) {
            out <- tryCatch(urlchecker::url_check(), error = function(e) e)
            if (inherits(out, "error")) {
              message("attempt ", attempt, ": ", conditionMessage(out))
            } else {
              res <- as.data.frame(out)
              if (nrow(res) == 0) break
            }
            if (attempt < 3) Sys.sleep(20)
          }
          if (is.null(res)) stop("urlchecker did not return a result")
          if (nrow(res) > 0) print(res[, intersect(names(res), c("URL", "From", "Status", "Message"))])
          status <- suppressWarnings(as.integer(res$Status))
          hard <- res[!is.na(status), , drop = FALSE]
          soft <- res[is.na(status), , drop = FALSE]
          if (nrow(soft) > 0) {
            message(nrow(soft), " URL(s) could not be reached from this runner; not treated as invalid:")
            for (u in soft$URL) message("  ", u)
          }
          if (nrow(hard) > 0) stop("URL problems found: ", paste(hard$URL, collapse = ", "))
        shell: Rscript {0}
