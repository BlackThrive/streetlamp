# Static quality gates: lintr, spelling and URL checks.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: quality

permissions: read-all

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr, any::spelling, any::urlchecker, local::.
          needs: lint

      - name: Lint
        run: lintr::lint_package()
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true

      - name: Spelling
        run: |
          res <- spelling::spell_check_package()
          if (nrow(res) > 0) {
            print(res)
            stop("Spelling errors found; add genuine words to inst/WORDLIST")
          }
        shell: Rscript {0}

      - name: URL check
        # Retried, and never handed to urlchecker's own print method, which
        # aborts. The first two runs of this workflow failed on a five second
        # timeout against data.police.uk, one of the package's own data
        # sources, which was reachable throughout. A URL that is genuinely
        # wrong still fails all three attempts.
        run: |
          ok <- FALSE
          for (attempt in 1:3) {
            res <- tryCatch(urlchecker::url_check(), error = function(e) e)
            if (!inherits(res, "error") && nrow(as.data.frame(res)) == 0) {
              ok <- TRUE
              break
            }
            if (attempt < 3) {
              message("attempt ", attempt, " found URL problems; retrying in 20s")
              Sys.sleep(20)
            }
          }
          if (!ok) {
            if (inherits(res, "error")) {
              message(conditionMessage(res))
            } else {
              print(as.data.frame(res))
            }
            stop("URL problems found")
          }
        shell: Rscript {0}
