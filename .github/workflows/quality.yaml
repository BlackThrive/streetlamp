# Static quality gates: lintr, spelling and URL checks.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: quality

permissions: read-all

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr, any::spelling, any::urlchecker, local::.
          needs: lint

      - name: Lint
        run: lintr::lint_package()
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true

      - name: Spelling
        run: |
          res <- spelling::spell_check_package()
          if (nrow(res) > 0) {
            print(res)
            stop("Spelling errors found; add genuine words to inst/WORDLIST")
          }
        shell: Rscript {0}

      - name: URL check
        # Retried, because a slow response is not a broken link. The first run
        # of this workflow failed on a five second timeout against
        # data.police.uk, which is one of the package's own data sources and
        # was perfectly reachable. A URL that is genuinely wrong fails all
        # three attempts.
        run: |
          for (attempt in 1:3) {
            res <- urlchecker::url_check()
            if (nrow(res) == 0) break
            if (attempt < 3) {
              message("attempt ", attempt, ": ", nrow(res), " problem(s); retrying")
              Sys.sleep(20)
            }
          }
          if (nrow(res) > 0) {
            print(res)
            stop("URL problems found")
          }
        shell: Rscript {0}
