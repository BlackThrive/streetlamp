# Workflow derived from the r-lib/actions examples:
# https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    # macOS on R-devel is allowed to fail. CRAN publishes no macOS binaries
    # for R-devel, so every dependency would have to build from source against
    # system libraries the runner does not carry (sf and spdep need GDAL, GEOS
    # and PROJ), and setup-r-dependencies stops before it starts. CRAN's own
    # macOS builders run release and oldrel, both of which are in this matrix
    # and both of which pass. The configuration stays here so that a genuine
    # failure is still visible.
    continue-on-error: ${{ matrix.config.allow-failure || false }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'devel', allow-failure: true}
          - {os: macos-latest,   r: 'release'}
          - {os: macos-latest,   r: 'oldrel-1'}
          - {os: windows-latest, r: 'devel'}
          - {os: windows-latest, r: 'release'}
          - {os: windows-latest, r: 'oldrel-1'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Tests, examples and vignettes must never touch the network.
      STREETLAMP_OFFLINE: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          error-on: '"warning"'
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
