url: https://black-thrive-global.github.io/streetlamp/
template:
  bootstrap: 5
  bslib:
    primary: "#1f2a44"

reference:
- title: Ingest
  desc: >
    Acquire force-month files from the data.police.uk archive without
    downloading whole snapshots, choose one version per force-month, and read
    crime, outcome and stop-count tables that carry a panel contract.
  contents:
  - has_concept("ingest")
- title: Contract
  contents:
  - has_concept("contract")
- title: Bundled reference tables
  desc: >
    Curated tables shipped with the package: crime and outcome
    classifications, national policy shocks, bank holidays and the ONS
    LSOA code lists and 2011 to 2021 best-fit lookup.
  contents:
  - has_concept("bundled data")
- title: Cache
  contents:
  - has_concept("cache")
- title: Package
  contents:
  - streetlamp-package
