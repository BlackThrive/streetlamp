url: https://black-thrive-global.github.io/streetlamp/
template:
  bootstrap: 5
  bslib:
    primary: "#1f2a44"

reference:
- title: Ingest
  desc: >
    Acquire force-month files from the data.police.uk archive without
    downloading whole snapshots, choose one version per force-month, and read
    crime, outcome and stop-count tables that carry a panel contract.
  contents:
  - has_concept("ingest")
- title: Panel and coverage
  desc: >
    Geography, population, the balanced area-by-month panel and the coverage
    audit.
  contents:
  - has_concept("panel")
- title: Treatment
  desc: >
    Define what is being evaluated: a continuous stop intensity, an
    intervention in named areas, staggered adoption dates, or a dated shock.
  contents:
  - has_concept("treatment")
- title: Estimators
  desc: >
    Panel estimators, each reporting its identifying assumption, clustered
    standard errors and the force-months it excluded.
  contents:
  - has_concept("estimators")
- title: Diagnostics
  desc: >
    What the estimates are worth: pre-trend testing with power, and placebo
    tests in time, space and outcome.
  contents:
  - has_concept("diagnostics")
- title: Simulation
  contents:
  - has_concept("simulation")
- title: Reporting
  contents:
  - has_concept("reporting")
- title: Contract
  contents:
  - has_concept("contract")
- title: Bundled reference tables
  desc: >
    Curated tables shipped with the package: crime and outcome
    classifications, national policy shocks, bank holidays and the ONS
    LSOA code lists and 2011 to 2021 best-fit lookup.
  contents:
  - has_concept("bundled data")
- title: Cache
  contents:
  - has_concept("cache")
- title: Package
  contents:
  - streetlamp-package
